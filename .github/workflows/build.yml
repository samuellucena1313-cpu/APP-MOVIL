name: Build APK
on: [push, pull_request]

# Aquí activamos lo que GitHub te pide para evitar el aviso de depreciación
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4 # Esta ya es la versión más actual, la variable env la hará correr en Node 24

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer cython virtualenv

      - name: Generar APK con Buildozer
        run: |
          yes | buildozer android debug
        
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-APK-Resultado
          path: bin/*.apk
          retention-days: 5
